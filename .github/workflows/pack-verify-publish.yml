# Packs the npm tarball with the `wasm` artifact and every `prebuild-*`
# artifact inside, installs it and runs the smoke test on 8 systems, and,
# when asked, publishes it with npm trusted publishing. Call it after
# build-wasm.yml and prebuild.yml. See WORKFLOWS.md.
name: Pack, verify and publish

on:
  workflow_call:
    inputs:
      wasm-artifact-path:
        description: Directory the `wasm` artifact is restored to (the same value given to build-wasm.yml).
        type: string
        required: true
      tarball-prefix:
        description: Start of the file name npm pack writes, e.g. kodespire-zstd-js for @kodespire/zstd-js.
        type: string
        required: true
      smoke-script:
        description: Smoke test ES module that checks the backend named in EXPECT_BACKEND.
        type: string
        required: true
      publish:
        description: Publish the verified tarball to npm.
        type: boolean
        default: false
      publish-dry-run:
        description: Run the publish job with `npm publish --dry-run` instead. Never publishes, even with `publish`. Fails if the version is already on npm.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: ${{ inputs.wasm-artifact-path }}
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true
      - run: npm ci
      - run: npm run build:ts
      - run: ls -R prebuilds && npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: ${{ inputs.tarball-prefix }}-*.tgz
          if-no-files-found: error

  verify:
    name: Verify ${{ matrix.os }}${{ matrix.container && ' (' }}${{ matrix.container }}${{ matrix.container && ')' }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest }
          - { os: macos-15-intel }
          - { os: windows-latest }
          - { os: windows-11-arm }
          - { os: ubuntu-latest }
          - { os: ubuntu-24.04-arm }
          - { os: ubuntu-latest, container: 'node:22-alpine' }
          - { os: ubuntu-latest, container: 'rockylinux/rockylinux:8' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.smoke-script }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        if: ${{ !matrix.container }}
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: tarball
      - name: Install and run the smoke test
        shell: bash
        env:
          TARBALL_PREFIX: ${{ inputs.tarball-prefix }}
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
        run: |
          set -euo pipefail
          mkdir -p consumer
          cp "$SMOKE_SCRIPT" consumer/smoke.mjs
          cp "$TARBALL_PREFIX"-*.tgz consumer/package.tgz
          test_cmd='npm init -y >/dev/null && npm install --no-audit --no-fund ./package.tgz && EXPECT_BACKEND=native node smoke.mjs'
          case "${{ matrix.container }}" in
            '') (cd consumer && sh -euc "$test_cmd") ;;
            rockylinux*)
              # glibc 2.28, the oldest the Linux prebuild targets. Node from the official tarball.
              docker run --rm -v "$PWD/consumer:/w" -w /w "${{ matrix.container }}" bash -euo pipefail -c "
                dnf -y -q install xz >/dev/null
                tarball=\$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | grep -o 'node-v[0-9.]*-linux-x64.tar.xz' | head -1)
                curl -fsSL https://nodejs.org/dist/latest-v22.x/\$tarball | tar -xJ -C /opt
                export PATH=/opt/\${tarball%.tar.xz}/bin:\$PATH
                $test_cmd" ;;
            *) docker run --rm -v "$PWD/consumer:/w" -w /w "${{ matrix.container }}" sh -euc "$test_cmd" ;;
          esac

  publish:
    name: Publish to npm
    if: inputs.publish || inputs.publish-dry-run
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: tarball
      # npm matches these claims against the package's trusted publisher. In a
      # reusable workflow, workflow_ref is the caller's workflow file.
      - name: Show the identity npm trusted publishing checks
        run: |
          echo "npm $(npm --version)"
          node --input-type=module -e '
            const url = `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org`;
            const response = await fetch(url, { headers: { authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
            if (!response.ok) throw new Error(`OIDC token request failed: ${response.status}`);
            const claims = JSON.parse(Buffer.from((await response.json()).value.split(".")[1], "base64url"));
            const { repository, ref, event_name, workflow_ref, job_workflow_ref, environment } = claims;
            console.log(JSON.stringify({ repository, ref, event_name, workflow_ref, job_workflow_ref, environment }, null, 2));
          '
      - run: npm publish "$TARBALL_PREFIX"-*.tgz --access public --provenance ${{ inputs.publish-dry-run && '--dry-run' || '' }}
        env:
          TARBALL_PREFIX: ${{ inputs.tarball-prefix }}
