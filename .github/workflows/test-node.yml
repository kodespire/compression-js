# Builds the native addon and runs the vitest suite on every OS and Node.js
# version in the matrix, against the `wasm` artifact from build-wasm.yml.
# See WORKFLOWS.md.
name: Test on Node.js

on:
  workflow_call:
    inputs:
      wasm-artifact-path:
        description: Directory the `wasm` artifact is restored to (the same value given to build-wasm.yml).
        type: string
        required: true
      cli-build:
        description: Command that builds the upstream command-line tool for interop tests. Skipped on Windows. Leave empty to skip.
        type: string
        default: ''
      os:
        description: JSON array of runner labels.
        type: string
        default: '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]'
      node-versions:
        description: JSON array of Node.js versions.
        type: string
        default: '[22, 24, 26]'

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node-versions) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: ${{ inputs.wasm-artifact-path }}
      - run: npm ci
      - run: npm run build:native
      - run: npm run build:ts
      - name: Build the upstream CLI for interop tests
        if: inputs.cli-build != '' && runner.os != 'Windows'
        run: ${{ inputs.cli-build }}
      - run: npm test
